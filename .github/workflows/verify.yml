name: Verify V3.1 shift routing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Test all isolated V3.1 backend workflows
        run: python -m pytest -q tests/
      - name: Check login and workspace JavaScript syntax
        run: |
          node --check web/auth-ui.js
          node --check web/workspace-auth.js
          node --check web/roster-admin.js
          node --check web/admin-standalone.js
          node --check web/shift-history.js
          node --check web/shift-data.js
          node --check web/manual-oos.js
          node --check web/facility-admin.js
