name: Verify V3.1 shift routing

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Test all isolated V3.1 backend workflows
        run: python -m pytest -q tests/
      - name: Check login and workspace JavaScript syntax
        run: |
          node --check web/auth-ui.js
          node --check web/workspace-auth.js
          node --check web/roster-admin.js
          node --check web/admin-standalone.js
          node --check web/shift-history.js
          node --check web/shift-data.js
          node --check web/manual-oos.js
          node --check web/breakdown-lifecycle.js
          node --check web/facility-admin.js
          node --check web/pm-needing-completion.js
          node --check web/analytics.js


  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install V3.1 dependencies and tests
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Verify Indianapolis time zone on Windows
        run: python -c "from zoneinfo import ZoneInfo; assert ZoneInfo('America/Indiana/Indianapolis')"
      - name: Run Windows V3.1 backend regression suite
        run: python -m pytest -q tests/

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python and Playwright dependencies
        run: |
          python -m pip install -r requirements.txt pytest httpx playwright
          python -m playwright install --with-deps chromium
      - name: Require an actual working Chromium browser
        run: python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); b.close(); p.stop()"
      - name: Run UI from login to report and End Shift in Chromium
        run: python -m pytest -q tests/test_browser_eml_template.py tests/test_browser_end_shift.py tests/test_report_consistency.py tests/test_browser_operational_workflow.py
